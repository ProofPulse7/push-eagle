# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "c866e24e9ce383cebeee6edb01496449"
name = "Push-Eagle"
application_url = "https://push-eagle-dashboard.vercel.app/api/auth/connect"
embedded = false

[build]
automatically_update_urls_on_dev = false

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = [ "inventory_levels/update" ]
  uri = "https://push-eagle-dashboard.vercel.app/api/shopify/webhooks/inventory-levels-update"
  include_fields = [
  "inventory_item_id",
  "available",
  "updated_at",
  "location_id"
]

  [[webhooks.subscriptions]]
  uri = "https://push-eagle-dashboard.vercel.app/api/shopify/webhooks/customers-data-request"
  compliance_topics = [ "customers/data_request" ]

  [[webhooks.subscriptions]]
  uri = "https://push-eagle-dashboard.vercel.app/api/shopify/webhooks/customers-redact"
  compliance_topics = [ "customers/redact" ]

  [[webhooks.subscriptions]]
  uri = "https://push-eagle-dashboard.vercel.app/api/shopify/webhooks/shop-redact"
  compliance_topics = [ "shop/redact" ]

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "https://push-eagle-dashboard.vercel.app/api/shopify/webhooks/app-scopes-update"

  [[webhooks.subscriptions]]
  topics = [ "checkouts/update", "checkouts/create" ]
  uri = "https://push-eagle-dashboard.vercel.app/api/shopify/webhooks/checkouts-update"
  include_fields = [
  "id",
  "token",
  "abandoned_checkout_url",
  "updated_at",
  "email",
  "customer.id",
  "line_items.product_id",
  "line_items.variant_id",
  "line_items.quantity",
  "line_items.url",
  "note_attributes"
]

  [[webhooks.subscriptions]]
  topics = [ "app_subscriptions/update" ]
  uri = "https://push-eagle-dashboard.vercel.app/api/shopify/webhooks/app-subscriptions-update"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "https://push-eagle-dashboard.vercel.app/api/shopify/webhooks/app-uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "fulfillments/update" ]
  uri = "https://push-eagle-dashboard.vercel.app/api/shopify/webhooks/fulfillments-update"
  include_fields = [
  "id",
  "order_id",
  "status",
  "shipment_status",
  "tracking_company",
  "tracking_numbers",
  "tracking_urls",
  "updated_at"
]

  [[webhooks.subscriptions]]
  topics = [ "products/update" ]
  uri = "https://push-eagle-dashboard.vercel.app/api/shopify/webhooks/products-update"
  include_fields = [
  "id",
  "title",
  "handle",
  "updated_at",
  "image.src",
  "variants.id",
  "variants.title",
  "variants.price",
  "variants.compare_at_price",
  "variants.inventory_item_id"
]

  [[webhooks.subscriptions]]
  topics = [ "carts/update" ]
  uri = "https://push-eagle-dashboard.vercel.app/api/shopify/webhooks/carts-update"
  include_fields = [
  "id",
  "token",
  "updated_at",
  "attributes",
  "note_attributes",
  "line_items.product_id",
  "line_items.variant_id",
  "line_items.quantity",
  "line_items.url"
]

  [[webhooks.subscriptions]]
  topics = [ "orders/create" ]
  uri = "https://push-eagle-dashboard.vercel.app/api/shopify/webhooks/orders-create"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_customer_events,read_customers,read_fulfillments,read_inventory,read_orders,read_products,read_themes,write_app_proxy,write_pixels"
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://push-eagle.vercel.app/auth/callback",
  "https://push-eagle.vercel.app/auth/shopify/callback",
  "https://push-eagle.vercel.app/api/auth"
]

[app_proxy]
url = "https://push-eagle-dashboard.vercel.app/api/storefront"
subpath = "push-eagle"
prefix = "apps"

